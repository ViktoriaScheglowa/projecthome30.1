version: "3.8"

services:
  web:
    build: .
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 10 &&
        echo 'Running migrations...' &&
        python manage.py migrate &&
        echo 'Starting server...' &&
        python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - .:/projecthome30.1
    environment:
      - DATABASE_HOST=db
      - NAME=${NAME}
      - USER=${USER}
      - PASSWORD=${PASSWORD}
      - PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/${CELERY_DB:-0}
      - CELERY_RESULT_BACKEND=redis://redis:6379/${CELERY_DB:-0}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/usr/share/nginx/html/static
      - media_volume:/media
    depends_on:
      web:
        condition: service_healthy

  db:
    image: postgres:16.3
    environment:
      POSTGRES_DB: ${NAME}
      POSTGRES_USER: ${USER}
      POSTGRES_PASSWORD: ${PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER} -d ${NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  celery:
    build: .
    command: >
      sh -c "
        echo 'Waiting for services...' &&
        sleep 20 &&
        echo 'Starting Celery worker...' &&
        celery -A config worker --loglevel=info
      "
    volumes:
      - .:/projecthome30.1
    environment:
      - DATABASE_HOST=db
      - NAME=${NAME}
      - USER=${USER}
      - PASSWORD=${PASSWORD}
      - PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/${CELERY_DB:-0}
      - CELERY_RESULT_BACKEND=redis://redis:6379/${CELERY_DB:-0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build: .
    command: >
      sh -c "
        echo 'Waiting for services...' &&
        sleep 25 &&
        echo 'Starting Celery beat...' &&
        celery -A config beat --loglevel=info
      "
    volumes:
      - .:/projecthome30.1
    environment:
      - DATABASE_HOST=db
      - NAME=${NAME}
      - USER=${USER}
      - PASSWORD=${PASSWORD}
      - PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/${CELERY_DB:-0}
      - CELERY_RESULT_BACKEND=redis://redis:6379/${CELERY_DB:-0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  static_volume:
  media_volume:
  redis_data: