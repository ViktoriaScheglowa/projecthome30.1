version: "3.8"

services:
  web:
    build: .
    command: sh -c "sleep 10 && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/projecthome30.1
      - static_volume:/projecthome30.1/static
      - media_volume:/projecthome30.1/media
    env_file:
      - .env
    environment:
      - HOST=db
      - PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/${CELERY_DB:-0}
      - CELERY_RESULT_BACKEND=redis://redis:6379/${CELERY_DB:-0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:8000"

  nginx:
    image: nginx:stable-alpine
    container_name: nginx_proxy_project30.1
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/usr/share/nginx/html/static
      - media_volume:/media
    depends_on:
      - web

  db:
    image: postgres:16.3
    container_name: postgres_project30.1
    environment:
      POSTGRES_DB: ${NAME}
      POSTGRES_USER: ${USER}
      POSTGRES_PASSWORD: ${PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${USER} -d ${NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: redis_project30.1
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  celery:
    build: .
    command: sh -c "sleep 15 && celery -A config worker --loglevel=info"
    volumes:
      - .:/projecthome30.1
    env_file:
      - .env
    environment:
      - HOST=db
      - PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/${CELERY_DB:-0}
      - CELERY_RESULT_BACKEND=redis://redis:6379/${CELERY_DB:-0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build: .
    command: sh -c "sleep 20 && celery -A config beat --loglevel=info"
    volumes:
      - .:/projecthome30.1
    env_file:
      - .env
    environment:
      - HOST=db
      - PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/${CELERY_DB:-0}
      - CELERY_RESULT_BACKEND=redis://redis:6379/${CELERY_DB:-0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  static_volume:
  media_volume:
  redis_data: