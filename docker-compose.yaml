version: "3.12"

services:
  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/projecthome30.1
      - static_volume:/projecthome30.1/static
      - media_volume:/projecthome30.1/media
    env_file:
      - .env
    environment:
      DATABASE_HOST: db
      REDIS_HOST: redis
    depends_on:
      - db
      - redis
      - celery_beat


  nginx:
    image: nginx:stable-alpine
    container_name: nginx_proxy_project30.1
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - staticfiles:/usr/share/nginx/html/static
      - media_volume:/media
    depends_on:
      - web

  db:
    image: postgres:16.3
    container_name: postgres_project30.1
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${NAME}
      POSTGRES_USER: ${USER}
      POSTGRES_PASSWORD: ${PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d ${NAME} -U ${USER}" ]
      interval: 30s
      timeout: 15s
      retries: 5

  redis:
    image: redis:7
    container_name: redis_project30.1
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "$REDIS_PASSWORD", "ping" ]
      interval: 30s
      timeout: 15s
      retries: 5

  celery:
    build: .
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/projecthome30.1
    env_file:
      - .env
    environment:
      DATABASE_HOST: db
      REDIS_HOST: redis
    depends_on:
      - db
      - redis

  celery_beat:
    build: .
    command: celery -A config beat --loglevel=info
    volumes:
      - .:/projecthome30.1
    env_file:
      - .env
    environment:
      DATABASE_HOST: db
      REDIS_HOST: redis
    depends_on:
      - db
      - redis

networks:
  default:

volumes:
  postgres_data:
  static_volume:
  staticfiles:
  redis_data:
  media_volume:

