name: Django CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      - name: Run Flake8
        run: flake8 .

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/projecthome30.1:${{ github.sha }} .

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/projecthome30.1:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Set up Venv
        run: | 
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          PROJECT_PATH="/home/${{ secrets.SSH_USER }}/projecthome30.1"
          mkdir -p "$PROJECT_PATH"
          cd "$PROJECT_PATH"
          
          if [ ! -d ".venv" ]; then
            python3 -m venv venv
          fi
          sudo apt install python3 python3-pip python3-venv -y
          EOF

      - name: Deploy docker to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          PROJECT_PATH="/home/${{ secrets.SSH_USER }}/projecthome30.1"
          mkdir -p "$PROJECT_PATH"
          cd "$PROJECT_PATH"
          
          git fetch --all
          git reset --hard origin/${{ github.ref_name }}
          
          sudo docker compose down || true
          git pull origin feature1 || git clone -b feature1 git@github.com:${{ github.repository }}.git .
          sudo docker compose up -d --build
          EOF
            

