user www-data;
worker_processes auto;
pid /run/nginx.pid;


events {
worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream django {
    server web:8000;
    }

    server {
        listen 80;
        server_name _;
        location /static/ {
            alias /app/static/;
        }

        root /var/www/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location /images/ {
            root /data;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8000;
        }
}
}